name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install deps
        run: uv sync --extra dev --extra ai --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: Mypy (strict) — src AND scripts, where every entry point lives
        run: uv run mypy src scripts
      - name: Pytest (and fail on any silent skip)
        # A skipped test reads as a passing one in the summary line, which is how the dashboard
        # module stayed unrun for months behind a gitignored-data guard (T3.3). Run once, then
        # reject a summary that reports skips.
        run: |
          set -o pipefail
          uv run pytest -q -rs 2>&1 | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then
            echo "::error::tests were skipped — a skip is not a pass. See the short summary above."
            exit 1
          fi
