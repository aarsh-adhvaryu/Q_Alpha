name: Paper daily

# The autonomous paper-trading pipeline (no AI in the loop): every weekday after NSE close it
# refreshes prices, marks the notional book to market, regenerates the dashboard, and commits the
# track record back to the repo. It NEVER trades — on rebalance days the dashboard flags
# "ACTION NEEDED" and a human approves the orders (`paper.py apply`).

on:
  schedule:
    # 12:23 UTC = 17:53 IST, after the 15:30 IST (10:00 UTC) close, weekdays only.
    # Deliberately OFF the top of the hour: GitHub heavily throttles on-the-hour
    # schedules under load and silently drops them (why "0 12" never fired). An
    # odd minute lands in an uncongested slot. Holidays just re-mark last close (harmless).
    - cron: "23 12 * * 1-5"
  workflow_dispatch: # allow a manual run from the Actions tab
    inputs:
      force_digest:
        description: "Also send the weekly digest now (verification)"
        type: boolean
        default: false

permissions:
  contents: write # to commit the updated book + dashboard

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install deps
        run: uv sync --extra dev --extra ai --frozen
      - name: Daily mark + dashboard (refreshes data; never trades)
        run: uv run python scripts/paper.py daily
      - name: Opportunity scan → Telegram alerts (edge-triggered; fail-soft, never blocks)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          uv run python scripts/scan_alerts.py
          ${{ github.event.inputs.force_digest == 'true' && '--force-digest' || '' }}
      - name: Daily AI market brief (context-only narrative + the auto-pilot SIGNAL; fail-soft)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/ai_brief.py daily
      # ⛔ DISABLED 2026-08-29. This funded and marked the System/Shadow/Baseline books, which are
      # ARCHIVED (reports/ARCHIVE_2026-08-28.md) — the run recorded System − Shadow = ₹0.00 on all 7
      # marks and a Baseline that beat both. Leaving it running kept writing fresh marks into books
      # the archive says are closed, so the repo simultaneously claimed a reset and carried on
      # accruing to the thing it reset. Its replacement is the twin (live/twin.py + live/runner.py),
      # wired here once the twin books are seeded — Phase 5.
      - name: Auto-pilot — SUPERSEDED by the twin; kept for one release, no longer run
        if: false
        continue-on-error: true # a fake-money measurement must never red the paper cron
        run: uv run python scripts/autopilot.py daily
      # The twin: five books on the user's real cash flows, four of them autonomous. This replaces
      # the auto-pilot step above. Fake money — no broker client is imported and nothing can place an
      # order. GIST_TOKEN reads the private tradebook master; without it the runner falls back to a
      # committed export and says so rather than marking a book with no flows.
      - name: The twin — step the autonomous books, mark all five, grade the gate (fail-soft)
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TRADEBOOK_GIST_ID: ${{ secrets.TRADEBOOK_GIST_ID }}
          # Without this the twin's AI step reads "key not set", returns no verdicts, and every
          # name is kept — so TWIN_FULL silently becomes TWIN_NO_AI and the ablation measures
          # nothing. Fail-soft is correct behaviour and a terrible thing to leave running unnoticed
          # for twelve months, which is precisely what the missing env block would have done.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/twin.py daily

      - name: Commit the track record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper/book.json data/paper/run_log.jsonl data/paper/alert_state.json reports/paper_dashboard.md reports/paper_equity.csv
          git add reports/ai_brief.md data/autopilot/state.json data/autopilot/ledger.json reports/autopilot_dashboard.md 2>/dev/null || true
          git add reports/ai_verdicts.md 2>/dev/null || true  # PR-8: the AI's per-name keep/drop sheet — written but never committed, so nobody could see what it decided
          # The System book trio (system = the former adaptive book; shadow = no-AI twin; baseline = NIFTYBEES)
          # The twin — five books, their decisions, and the gate. This is what accrues now.
          git add data/twin/books.json data/twin/marks.json 2>/dev/null || true
          git add reports/twin_dashboard.md reports/twin_decisions.md 2>/dev/null || true
          # The append-only record. THIS IS THE ONE THAT ACCUMULATES — every other twin file above
          # is a snapshot the next run overwrites. Left uncommitted, each day's history.jsonl is
          # appended to an empty file inside the container and destroyed with it, which is the exact
          # defect these files were added to fix. Own line: `git add` is all-or-nothing.
          git add data/twin/history.jsonl 2>/dev/null || true
          git add data/twin/ai_verdicts.jsonl 2>/dev/null || true
          # ⛔ The auto-pilot books below are ARCHIVED (reports/ARCHIVE_2026-08-28.md) and their step
          # is `if: false`. These lines stay one release so a stale working copy cannot resurrect
          # them by committing a file the cron no longer writes.
          git add data/paper/adaptive_book.json 2>/dev/null || true
          git add data/paper/shadow_book.json 2>/dev/null || true
          git add data/autopilot/baseline_book.json 2>/dev/null || true
          git add data/autopilot/system_flows.json 2>/dev/null || true
          git add data/autopilot/system_track.csv 2>/dev/null || true
          git add data/autopilot/pending_injections.json 2>/dev/null || true  # Add-money queue (cleared after apply)
          git add data/autopilot/manual_injections.json 2>/dev/null || true  # only after a manual Add-money (git add is all-or-nothing → own line)
          git diff --staged --quiet || git commit -m "paper: daily mark $(date -u +%F) [skip ci]"
          git push
      # A green cron that accrued nothing is the worst outcome: it looks healthy for months while the
      # record stands still. Every step above is `continue-on-error` and twin.py is fail-soft by
      # design (a stopped cron loses more days than a bad row), so nothing else would ever notice.
      - name: Postcondition — today's mark must actually be on file
        run: |
          python3 - <<'CHECK'
          import json, pathlib, subprocess, sys
          from datetime import date, timezone, datetime
          p = pathlib.Path("data/twin/history.jsonl")
          if not p.exists():
              sys.exit("FAIL: data/twin/history.jsonl does not exist - nothing is accruing")
          rows = [json.loads(l) for l in p.read_text().splitlines() if l.strip()]
          if not rows:
              sys.exit("FAIL: history.jsonl is empty")
          latest = max(r["as_of"] for r in rows)
          today = datetime.now(timezone.utc).date().isoformat()
          print(f"latest recorded mark: {latest} (today {today}, {len(rows)} rows on file)")
          if latest != today:
              sys.exit(
                  f"FAIL: no mark recorded for {today} - the twin ran but produced no row, "
                  "so this day of evidence is lost. Check the twin step's log above."
              )
          committed = subprocess.run(
              ["git", "log", "-1", "--format=%H", "--", str(p)],
              capture_output=True, text=True).stdout.strip()
          if not committed:
              sys.exit("FAIL: history.jsonl has never been committed - it dies with the runner")
          CHECK

      - name: Alert on pipeline failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          uv run python scripts/scan_alerts.py --pipeline-failed
          "Paper daily job failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
