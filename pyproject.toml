[project]
name = "qalpha"
version = "0.1.0"
description = "Q-Alpha — quantitative wealth engine for Indian equities (Phase 0: strategy validation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
    "yfinance>=0.2.40",
    "structlog>=24.1",
    "openpyxl>=3.1",
    "kiteconnect>=5.0",
    "python-dotenv>=1.0",
    # Primary documents are PDFs. Pure-Python, no system libraries, works offline — an evidence
    # spine that needs a native toolchain would not survive the CI runner it has to live on.
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "pandas-stubs>=2.2",
    "types-pyyaml",
]
# Optional, quarantined LLM layer for the daily AI market brief (context-only narrative + the
# auto-pilot's Book-B nudge). NOT a core dep — the engine/factors/backtest/CI never import it; install
# with `uv sync --extra ai`. Keeps the product deterministic where it must be (rule (a) intact).
ai = [
    "anthropic>=0.40",
]
# The research track (research/) — ideas that have NOT passed a pre-registered test — lives in THIS
# repo since 2026-08-28, walled off by tests/test_repo_boundary.py rather than by being a separate
# repository. Its heavy deps are optional and its suite is off `testpaths`, so the product run never
# depends on them and never inherits their skips. See research/README.md.
research = [
    "hmmlearn>=0.3",  # Gaussian HMM for regime/risk_state.py (a published negative, kept as evidence)
]
# Quantum track (Q_alpha.md §15) — AUM-gated (₹50L+) and twice a published negative. Heavy.
quantum = [
    "qiskit>=1.0",
    "qiskit-algorithms>=0.3",
    "qiskit-optimization>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qalpha"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# E501: line length handled by formatter.
# RUF001-003: comments/strings intentionally use unicode (₹, ×, –, § references to Q_alpha.md).
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
# WITHOUT THIS, CHECKING scripts/ IS VACUOUS. `ignore_missing_imports` below is set for yfinance
# and sklearn, but it applies to every unresolvable import — and from outside src/ that includes
# `qalpha` itself, so the whole package resolved to Any and every call through it went unchecked.
# scripts/ holds the entry points, so the programs were the one part of this repo nothing verified:
# `atomic.write_text(..., encoding="utf-8")` shipped and raised TypeError on every twin run until
# 2026-09-11. Naming the source root here makes `mypy src scripts` real.
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true   # yfinance/sklearn ship no stubs
# pandas-stubs/numpy frequently infer Any for elementwise ops; chasing those with casts adds noise
# without catching real bugs. We keep full strictness on OUR signatures but relax this one sub-flag.
warn_return_any = false
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# OUR OWN PACKAGE IS NEVER "missing". `ignore_missing_imports` above is for yfinance and sklearn,
# which ship no stubs — but it applies to every unresolvable import, so a `qalpha.*` module that
# does not exist resolved to `Any` and the check passed. That hid two defects on 2026-09-12: an
# unchecked keyword argument that crashed the twin step on every run, and then a deleted module
# still being imported by scripts/twin.py, which mypy called clean and Python could not load.
[[tool.mypy.overrides]]
module = ["qalpha.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/qalpha"]
