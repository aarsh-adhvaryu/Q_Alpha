[project]
name = "qalpha"
version = "0.1.0"
description = "Q-Alpha — an AI investor running a paper book of Indian equities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "yfinance>=0.2.40",
    "openpyxl>=3.1",  # pandas' reader for the Zerodha Tax P&L workbook
    "python-dotenv>=1.0",
    # Primary documents are PDFs. Pure-Python, no system libraries, works offline — an evidence
    # spine that needs a native toolchain would not survive the CI runner it has to live on.
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "pandas-stubs>=2.2",
    "types-pyyaml",
]
# The model client. Optional so the accounting and the page install without it; the evening's
# filing reader and the investor need it. `uv sync --extra dev --extra ai`.
ai = [
    "anthropic>=0.40",
]
# The knowledge graph's database driver. Optional: the graph's record is a log on disk, and every
# graph question can be answered from it; Neo4j is the projection you traverse and look at.
# `uv sync --extra dev --extra ai --extra graph`.
graph = [
    "neo4j>=5.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qalpha"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# E501: line length handled by formatter.
# RUF001-003: comments/strings intentionally use unicode (₹, ×, –, § references to Q_alpha.md).
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
# WITHOUT THIS, CHECKING scripts/ IS VACUOUS. `ignore_missing_imports` below is set for yfinance
# and sklearn, but it applies to every unresolvable import — and from outside src/ that includes
# `qalpha` itself, so the whole package resolved to Any and every call through it went unchecked.
# scripts/ holds the entry points, so the programs were the one part of this repo nothing verified:
# `atomic.write_text(..., encoding="utf-8")` shipped and raised TypeError on every twin run until
# 2026-09-11. Naming the source root here makes `mypy src scripts` real.
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true   # yfinance ships no stubs
# pandas-stubs/numpy frequently infer Any for elementwise ops; chasing those with casts adds noise
# without catching real bugs. We keep full strictness on OUR signatures but relax this one sub-flag.
warn_return_any = false
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# OUR OWN PACKAGE IS NEVER "missing". `ignore_missing_imports` above is for yfinance,
# which ship no stubs — but it applies to every unresolvable import, so a `qalpha.*` module that
# does not exist resolved to `Any` and the check passed. That hid two defects on 2026-09-12: an
# unchecked keyword argument that crashed the twin step on every run, and then a deleted module
# still being imported by scripts/twin.py, which mypy called clean and Python could not load.
[[tool.mypy.overrides]]
module = ["qalpha.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/qalpha"]
